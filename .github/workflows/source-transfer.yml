name: One-time pinned source transfer
on:
  push:
    branches: [implementation/freefall-personalization]
    paths: [.github/workflows/source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transfer pinned source without altering main
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/gireeshkumarreddy/freefall-portfolio.git /tmp/freefall-source
          git -C /tmp/freefall-source checkout 83c3ed252e8046dd7f5497d46e4078c82c03b478
          git -C /tmp/freefall-source archive HEAD | tar -x -C "$GITHUB_WORKSPACE"
          rm .github/workflows/source-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish exact pinned Freefall source baseline"
          git push origin HEAD:implementation/freefall-personalization
